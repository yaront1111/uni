# PostgreSQL 17 client authentication for Uai (ADR 0043 D4).
#
# Install as /etc/postgresql/17/main/pg_hba.conf (postgres:postgres 0640),
# replacing the packaged file, then `systemctl reload postgresql`.
# The five logins reach database unai only over TLS on loopback with SCRAM.
# The monthly restore drill (`pnpm restore:drill`, ADR 0043 D9) also reaches
# its per-run database unai_restore_drill_<16 hex>: `pnpm restore` connects as
# unai_migrator and the read probes as the temporary login
# unai_restore_drill_probe_<16 hex>. A field that starts with / is a regular
# expression (PostgreSQL 16+), matched unanchored, hence ^...$; a pattern with a
# comma must be double-quoted, or the server refuses the whole file.
# The postgres superuser connects only through the local socket as the postgres
# OS user (provision.sql). There is deliberately no non-TLS `host` line.

hostssl unai unai_api_login,unai_worker_login,unai_auth_login,unai_backup,unai_migrator 127.0.0.1/32 scram-sha-256
hostssl /^unai_restore_drill_[0-9a-f]{16}$ unai_migrator,/^unai_restore_drill_probe_[0-9a-f]{16}$ 127.0.0.1/32 scram-sha-256
local all postgres peer
