# PostgreSQL 17 server settings for Uai (ADR 0043 D4).
#
# Install as /etc/postgresql/17/main/conf.d/unai.conf (root:root 0644). Debian's
# postgresql.conf includes conf.d last, so these settings win.
# listen_addresses and max_connections take effect only after
# `systemctl restart postgresql`.
# With ssl = on, PostgreSQL does not start until the internal-CA leaf (ADR 0043
# D2) exists at both paths below; the key file is root:postgres 0640.

listen_addresses = '127.0.0.1'
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/etc/unai/tls/postgres/cert.pem'
ssl_key_file = '/etc/unai/tls/postgres/key.pem'
password_encryption = scram-sha-256
max_connections = 100
superuser_reserved_connections = 3
