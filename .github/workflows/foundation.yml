name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Lint runs here and in the CLI, never in the deployment (ADR 0014). The
      # report is the artifact the operations registry screen displays.
      - run: pnpm validate:registry --report registry-lint-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-lint-report
          path: registry-lint-report.json
          if-no-files-found: ignore

